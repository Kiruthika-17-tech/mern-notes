<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                display: flex;
                flex-direction:column-reverse;
                background-color: dodgerblue;
            }
            .container1{
                display: flex;
                flex-direction:row-reverse;
                background-color: dodgerblue;
            }
            .container div{
                background-color: #f1f1f1;
                margin: 10px;
                padding: 20px;
                font-size: 24px;
            }
            .container1 div{
                background-color: #f1f1f1;
                margin: 10px;
                padding: 20px;
                font-size: 24px;
            }
        </style>
    </head>
    <body>
        <h1>Create a Flex Container for column-reverse</h1>
        <div class="container">
            <div>Item 1</div>
            <div>Item 2</div>
            <div>Item 3</div>
            <div>Item 4</div>
            <div>Item 5</div>
            <div>Item 6</div>
            <div>Item 7</div>
            <div>Item 8</div>
        </div>
        <h1>Create a Flex Container for row-reverse</h1>
        <div class="container1">
            <div>Item 1</div>
            <div>Item 2</div>
            <div>Item 3</div>
            <div>Item 4</div>
            <div>Item 5</div>
            <div>Item 6</div>
            <div>Item 7</div>
            <div>Item 8</div>
        </div>
    </body>
</html>
