<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                display: grid;
                grid-template-columns:80px 200px auto;
                background-color: rgb(136, 188, 240);
                padding: 10px;
            }
            .container div{
                background-color: #f1f1f1;
                border: 1px solid black;
                padding: 10px;
                font-size: 30px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>Grid layout</h1>
        <p> A Grid Layout with mixed Width</p>
        <div class="container"> 
        <div>1</div>
        <div>2</div>
        <div>3</div> 
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
    </body>
</html>
