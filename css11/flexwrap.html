<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                display: flex;
                flex-wrap: nowrap;
                background-color: dodgerblue;
            }
            .container1{
                display: flex;
                flex-wrap: wrap;
                background-color: dodgerblue;
            }
            .container2{
                display: flex;
                flex-wrap: wrap-reverse;
                background-color: dodgerblue;
            }
            .container div{
                background-color: #f1f1f1;
                width: 100px;
                margin: 10px;
                padding: 20px;
                text-align: center;
                font-size: 24px;
            }
            .container1 div{
                background-color: #f1f1f1;
                width: 100px;
                margin: 10px;
                padding: 20px;
                text-align: center;
                font-size: 24px;
            }
            .container2 div{
                background-color: #f1f1f1;
                width: 100px;
                margin: 10px;
                padding: 20px;
                text-align: center;
                font-size: 24px;
            }
        </style>
    </head>
    <body>
        <h1>Flex Container-No wrap</h1>
        <div class="container">
            <div>Item 1</div>
            <div>Item 2</div>
            <div>Item 3</div>
            <div>Item 4</div>
            <div>Item 5</div>
            <div>Item 6</div>
            <div>Item 7</div>
            <div>Item 8</div>
            <div>Item 9</div>
        </div>
        <h1>Flex Container-Wrap</h1>
        <div class="container1">
            <div>Item 1</div>
            <div>Item 2</div>
            <div>Item 3</div>
            <div>Item 4</div>
            <div>Item 5</div>
            <div>Item 6</div>
            <div>Item 7</div>
            <div>Item 8</div>
            <div>Item 9</div>
        </div>
        <h1>Flex Container-Wrap reverse</h1>
        <div class="container2">
            <div>Item 1</div>
            <div>Item 2</div>
            <div>Item 3</div>
            <div>Item 4</div>
            <div>Item 5</div>
            <div>Item 6</div>
            <div>Item 7</div>
            <div>Item 8</div>
            <div>Item 9</div>
        </div>
    </body>
</html>
